<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case 3D Preview</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#2a313c;--text:#e6edf3;--mute:#8b949e;--accent:#58a6ff}
:root[data-theme="light"]{--bg:#f4f6f8;--card:#fff;--line:#d8dee4;--text:#1f2328;--mute:#59636e;--accent:#0969da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#view{width:100%;height:520px;border-radius:8px;background:#0b0f14;touch-action:none;cursor:grab}
h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.ctl{margin-bottom:14px}.ctl label{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.dim{color:var(--mute);font-size:13px;margin:10px 0 0}
</style></head><body><div class="wrap">
<h1>Enclosure 3D preview</h1>
<p class="sub">Drag to rotate, scroll to zoom. Ghost parts show where the display, ESP32 board, DHT11 and button sit.</p>
<div class="grid">
 <div class="card"><div id="view" role="img" aria-label="3D view of the enclosure"></div></div>
 <div class="card">
  <h2>View</h2>
  <div class="row"><button id="vf">Front</button><button id="vb">Back</button><button id="vs">Side</button><button id="vi">Iso</button></div>
  <div class="ctl"><label for="ex">Explode <output id="exo">0</output></label><input id="ex" type="range" min="0" max="100" value="0"></div>
  <div class="ctl"><label for="op">Body opacity <output id="opo">35%</output></label><input id="op" type="range" min="10" max="100" value="35"></div>
  <label class="chk"><input type="checkbox" id="cCover" checked> <span class="sw" style="background:#8b9bb4"></span>Cover</label>
  <label class="chk"><input type="checkbox" id="cParts" checked> Components (ghost)</label>
  <p class="dim"><span class="sw" style="background:#3fb950"></span>TFT &nbsp;<span class="sw" style="background:#1f6f43"></span>ESP32-C6 &nbsp;<span class="sw" style="background:#58a6ff"></span>DHT11 &nbsp;<span class="sw" style="background:#f85149"></span>Button</p>
  <p class="dim" id="dims"></p>
 </div>
</div></div>
<script>/*THREE*/</script>
<script>/*ORBIT*/</script>
<script>
const DATA = /*DATA*/;
const el = document.getElementById('view');
(function(){try{const c=document.createElement('canvas');if(!(c.getContext('webgl')||c.getContext('experimental-webgl')))throw 0;}catch(e){
 el.innerHTML='<p style="padding:20px;color:#e6edf3">WebGL is not available in this viewer. Open this file in Chrome or Firefox instead.</p>';}})();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f14);
const cam = new THREE.PerspectiveCamera(40, 1, 1, 2000);
const rend = new THREE.WebGLRenderer({antialias:true}); el.appendChild(rend.domElement);
const ctl = new THREE.OrbitControls(cam, rend.domElement); ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.85));
const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(-80, 120, -150); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.35); dl2.position.set(120, -60, 150); scene.add(dl2);

function mesh(d, color, opts={}) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(d.v), 3));
  g.setIndex(d.f); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial(Object.assign({color, roughness:.6, metalness:.05, side:THREE.DoubleSide}, opts)));
  scene.add(m); return m;
}
const body = mesh(DATA.body, 0x5b6b85, {transparent:true, opacity:.35});
const cover = mesh(DATA.cover, 0x8b9bb4);
const parts = {
  display: mesh(DATA.display, 0x3fb950), esp32: mesh(DATA.esp32, 0x1f6f43),
  dht11: mesh(DATA.dht11, 0x58a6ff), button: mesh(DATA.button, 0xf85149)
};
const d = DATA.dims, c = new THREE.Vector3(0, 0, d.D / 2);
document.getElementById('dims').textContent = `Outer size: ${d.OW.toFixed(1)} × ${d.OH.toFixed(1)} × ${d.D.toFixed(1)} mm (W × H × D)`;

function view(p){ cam.position.set(c.x+p[0], c.y+p[1], c.z+p[2]); ctl.target.copy(c); ctl.update(); }
const V = {vf:[0,0,-170], vb:[0,0,170], vs:[170,0,0], vi:[-110,80,-130]};
for (const k in V) document.getElementById(k).onclick = () => view(V[k]);
view(V.vi);

function apply(){
  const e = +document.getElementById('ex').value; document.getElementById('exo').textContent = e;
  const dz = e * 0.5;
  cover.position.z = dz; parts.esp32.position.z = dz;
  body.material.opacity = document.getElementById('op').value/100;
  document.getElementById('opo').textContent = document.getElementById('op').value + '%';
  cover.visible = document.getElementById('cCover').checked;
  const pv = document.getElementById('cParts').checked; for (const k in parts) parts[k].visible = pv;
}
['ex','op','cCover','cParts'].forEach(i => document.getElementById(i).addEventListener('input', apply)); apply();

function size(){ const w = el.clientWidth, h = el.clientHeight; rend.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
(function loop(){ requestAnimationFrame(loop); ctl.update(); rend.render(scene, cam); })();
</script></body></html>
