<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="780" viewBox="0 0 1310 780"><rect width="1310" height="780" fill="#ffffff"/><text x="24" y="34" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="start">WiRadar-C6 Lite — Sơ đồ hệ thống, bản chỉ phần cứng (không web, không Access Point)</text><rect x="30" y="70" width="200" height="70" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/><text x="130.0" y="94" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Nút bấm</text><text x="130.0" y="116" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">GPIO2 (ngoài) + BOOT GPIO9</text><rect x="30" y="170" width="200" height="70" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/><text x="130.0" y="194" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Cảm biến DHT11</text><text x="130.0" y="216" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">GPIO1 · 1-wire</text><rect x="30" y="340" width="200" height="100" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/><text x="130.0" y="364" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Router Wi-Fi nhà</text><text x="130.0" y="386" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">nguồn CSI</text><text x="130.0" y="404" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" tex