<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600"><rect width="1280" height="600" fill="#ffffff"/><text x="24" y="34" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="start">Thao tác nút bấm theo thời gian giữ (nút ngoài GPIO2 hoặc nút BOOT)</text><text x="70" y="108" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="start">Màn hình hiện thanh tiến trình khi giữ quá 1 s; hành động xảy ra khi THẢ NÚT.</text><rect x="70.0" y="140" width="95.0" height="34" fill="#2da44e" fill-opacity="0.9"/><text x="117.5" y="162" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">Ngắn</text><rect x="165.0" y="140" width="380.0" height="34" fill="#0969da" fill-opacity="0.9"/><text x="355.0" y="162" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">Giữ 1–5 s</text><rect x="545.0" y="140" width="475.0" height="34" fill="#9a6700" fill-opacity="0.9"/><text x="782.5" y="162" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">Giữ 5–10 s</text><rect x="1020.0" y="140" width="190.0" height="34" fill="#8250df" fill-opacity="0.9"/><text x="1115.0" y="162" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">Giữ ≥ 10 s</text><line x1="70.0" y1="174" x2="70.0" y2="188" stroke="#57606a" stroke-width="2"/><text x="70.0" y="206" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">0 s</text><line x1="165.0" y1="174" x2="165.0" y2="188" stroke="#57606a" stroke-width="2"/><text x="165.0" y="206" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">1 s</text><line x1="545.0" y1="174" x2="545.0" y2="188" stroke="#57606a" stroke-width="2"/><text x="545.0" y="206" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">5 s</text><line x1="1020.0" y1="174" x2="1020.0" y2="188" stroke="#57606a" stroke-width="2"/><text x="1020.0" y="206" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">10 s</text><text x="1210" y="206" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#57606a" text-anchor="end">thời gian giữ nút →</text><path d="M117.5,176 L117.5,226 L205.0,226 L205.0,276" fill="none" stroke="#2da44e" stroke-width="1.6"/><polygon points="205.0,276.0 200.5,266.0 209.5,266.0" fill="#2da44e"/><path d="M355.0,176 L355.0,226 L495.0,226 L495.0,276" fill="none" stroke="#0969da" stroke-width="1.6"/><polygon points="495.0,276.0 490.5,266.0 499.5,266.0" fill="#0969da"/><path d="M782.5,176 L782.5,226 L785.0,226 L785.0,276" fill="none" stroke="#9a6700" stroke-width="1.6"/><polygon points="785.0,276.0 780.5,266.0 789.5,266.0" fill="#9a6700"/><path d="M1115.0,176 L1115.0,226 L1075.0,226 L1075.0,276" fill="none" stroke="#8250df" stroke-width="1.6"/><polygon points="1075.0,276.0 1070.5,266.0 1079.5,266.0" fill="#8250df"/><text x="228" y="262" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="start">Bản đầy đủ (WiRadar_C6)</text><rect x="70" y="280" width="270" height="80" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="205.0" y="304" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Đổi màn hình</text><text x="205.0" y="326" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">Mạng → Nhiệt/Ẩm → Radar</text><text x="205.0" y="344" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">→ Đồ thị → Mạng</text><rect x="360" y="280" width="270" height="80" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="495.0" y="304" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Hiệu chỉnh lại radar</text><text x="495.0" y="326" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">giữ khu vực yên tĩnh 5 s</text><text x="495.0" y="344" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">xoá lịch sử, tính lại mức nền</text><rect x="650" y="280" width="270" height="80" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><text x="785.0" y="304" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Tạo lại Access Point</text><text x="785.0" y="326" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">&quot;WiRadar-C6-Setup&quot;</text><text x="785.0" y="344" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">điện thoại chọn Wi-Fi nhà</text><rect x="940" y="280" width="270" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="1075.0" y="304" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Đổi chuẩn Wi-Fi 4 ⇄ 6</text><text x="1075.0" y="326" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">(kế hoạch) 11n ⇄ 11ax</text><text x="1075.0" y="344" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">tự kết nối lại + hiệu chỉnh</text><text x="70" y="412" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="start">Bản Lite (WiRadar_C6_Lite)</text><rect x="70" y="430" width="270" height="80" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="205.0" y="454" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Đổi màn hình</text><text x="205.0" y="476" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">Nhiệt/Ẩm → Radar → Đồ thị</text><text x="205.0" y="494" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">→ Mạng → Nhiệt/Ẩm</text><rect x="360" y="430" width="270" height="80" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="495.0" y="454" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Hiệu chỉnh lại radar</text><text x="495.0" y="476" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">giữ khu vực yên tĩnh 5 s</text><text x="495.0" y="494" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">xoá lịch sử, tính lại mức nền</text><rect x="650" y="430" width="270" height="80" rx="10" fill="#eaeef2" stroke="#57606a" stroke-width="2"/><text x="785.0" y="454" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">(không có hành động)</text><text x="785.0" y="476" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">bản Lite không có Access Point</text><text x="785.0" y="494" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">thả nút: như giữ 1–5 s</text><rect x="940" y="430" width="270" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="1075.0" y="454" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1f2328" text-anchor="middle">Đổi chuẩn Wi-Fi 4 ⇄ 6</text><text x="1075.0" y="476" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">(kế hoạch) 11n ⇄ 11ax</text><text x="1075.0" y="494" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#3d444d" text-anchor="middle">tự kết nối lại + hiệu chỉnh</text><text x="70" y="566" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#57606a" text-anchor="start">Lưu ý: mốc &quot;giữ ≥ 10 s&quot; là tính năng sẽ thêm cho thí nghiệm so sánh Wi-Fi 4 / Wi-Fi 6. Mốc 5 s của bản đầy đủ</text><text x="70" y="585" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#57606a" text-anchor="start">sẽ chuyển sang thực hiện khi thả nút (hiện tại firmware chạy ngay lúc đủ 5 s).</text></svg>